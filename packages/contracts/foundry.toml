[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
remappings = [
  "forge-std/=dependencies/forge-std-1.12.0/src/",
  "openzeppelin-contracts/=node_modules/@openzeppelin/contracts/",
]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./artifacts/server" },
]

[profile.default.fuzz]
runs = 512
max_test_rejects = 65536

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false

[dependencies]
forge-std = { version = "1.12.0", git = "https://github.com/foundry-rs/forge-std.git", tag = "v1.12.0" }
