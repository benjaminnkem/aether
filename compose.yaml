services:
  mongodb:
    image: mongo:8
    command: ["mongod", "--port", "27018", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27018"
    volumes:
      - aether-mongodb:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --port 27018 --quiet --eval ''try { const configuration = rs.conf(); if (configuration.members[0].host !== "localhost:27018") { configuration.members[0].host = "localhost:27018"; rs.reconfig(configuration, {force:true}); } rs.status().ok } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27018"}]}).ok }''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  aether-mongodb:
